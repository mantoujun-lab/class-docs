name: "✨ 功能请求"
description: "为班级知识库提出新的内容/页面/工具需求"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 25 级计算机应用 1 班知识库提出新想法 ✨ 请尽量填写完整, 这有助于我们理解你的需求并尽快跟进.
        站点基于 VitePress 2 构建, 内容放置在 `docs/course | guide | tools | news` 等目录.

  - type: textarea
    id: description
    attributes:
      label: 描述需求
      description: 清晰地描述你想要的功能, 这个功能解决什么问题?
      placeholder: "我希望网站可以..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 为什么需要这个功能? 它会带来什么价值?
      placeholder: "目前班级里..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望功能如何实现? 有参考样例的话可以贴链接.
      placeholder: "可以参考 xxx 网站的做法..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否考虑过其他实现方式? 为什么不选择它们?
      placeholder: "也可以用 xxx, 但是..."
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 这个功能主要涉及哪一部分?
      multiple: true
      options:
        - 课程笔记 (docs/course)
        - 学习指南 (docs/guide)
        - 实用工具 (docs/tools)
        - 行业资讯 (docs/news)
        - 宿舍 7S / 班级规范
        - 首页 / 导航栏 / 侧边栏
        - 搜索 / 国际化 (i18n)
        - 样式 / 主题 / 组件复用
        - 构建 / 部署 (VitePress)
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 还有什么需要补充的吗? 草图、链接、截图都可以.
      placeholder: "(可选)"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 提交前请确认
      options:
        - label: 我已阅读 README, 确认这个功能尚未实现.
          required: true
        - label: 我已搜索过现有的 issues, 没有重复请求.
          required: true
